name: FIA RAG tests (minimal dependencies)

on:
  push:
    branches:
      - main
    paths:
      - "core_modules/rule_checker/fia_rag/**"
      - "core_modules/rule_checker/fia_files.py"
      - "scripts/*fia*"
      - "tests/test_fia_*.py"
      - "tests/test_fetch_fia_regulations.py"
      - "tests/test_check_fia_rag.py"
      - "tests/helpers.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "requirements-rag.txt"
      - ".github/workflows/fia-rag-tests.yml"
  pull_request:
    paths:
      - "core_modules/rule_checker/fia_rag/**"
      - "core_modules/rule_checker/fia_files.py"
      - "scripts/*fia*"
      - "tests/test_fia_*.py"
      - "tests/test_fetch_fia_regulations.py"
      - "tests/test_check_fia_rag.py"
      - "tests/helpers.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "requirements-rag.txt"
      - ".github/workflows/fia-rag-tests.yml"

jobs:
  rag-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-rag.txt
      - name: Install RAG dependencies only
        run: pip install -r requirements-rag.txt
      - name: Run RAG and downloader tests
        run: python -m pytest -q tests/test_fia_*.py tests/test_check_fia_rag.py tests/test_fetch_fia_regulations.py
