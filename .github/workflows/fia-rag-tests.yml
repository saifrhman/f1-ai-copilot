name: FIA RAG tests

on:
  push:
    branches:
      - main
      - fix/fia-rag-pipeline
    paths:
      - "core_modules/rule_checker/fia_rag_agent.py"
      - "tests/test_fia_rag_agent.py"
      - "requirements-rag.txt"
      - ".github/workflows/fia-rag-tests.yml"
  pull_request:
    paths:
      - "core_modules/rule_checker/fia_rag_agent.py"
      - "tests/test_fia_rag_agent.py"
      - "requirements-rag.txt"
      - ".github/workflows/fia-rag-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install FIA RAG dependencies
        run: pip install -r requirements-rag.txt
      - name: Run FIA RAG unit tests
        run: python -m pytest -q tests/test_fia_rag_agent.py
