name: FIA source discovery (live)

# Checks that the current official regulation PDFs can still be discovered on fia.com.
# Runs on a schedule rather than on every pull request, so an FIA website change or
# outage is reported without blocking unrelated work.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install downloader dependencies
        run: pip install requests==2.34.2 pypdf==6.19.0
      - name: Discover current FIA F1 regulation PDFs (no download)
        run: python scripts/fetch_fia_regulations.py --dry-run
