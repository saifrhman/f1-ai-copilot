name: Project tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install ffmpeg (M4A/WebM audio decoding tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install locked dependencies
        run: pip install -r requirements-lock.txt
      - name: Compile Python source
        run: python -m compileall -q app core_modules scripts tests ui
      - name: Run the complete test suite
        run: python -m pytest -q -rs
      - name: Run the strategy example
        run: python -m core_modules.strategy_optimizer.example_usage
      - name: Import the API the documented way
        run: python -c "import app.main"
